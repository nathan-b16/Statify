<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recommendations</title>
</head>
<body>

<h1>Your Most Played Tracks</h1>

<div>
    <div>
        <section id="top-tracks" class="midtop-tracks">
            <h2 class="miniheader">Top Tracks</h2>
            <ul>
                <li th:each="track : ${tracks}" th:if="${track != null}">
                    <img th:if="${track.album != null and track.album.images != null and track.album.images.length > 0}"
                         th:src="${track.album.images[0].url}" alt="Track Image" style="width: 50px; height: 50px; border-radius: 4px; margin-right: 15px;">
                    <span th:text="${track.name}" style="color: var(--text-main); font-weight: bold;"></span>
                </li>
            </ul>
        </section>
    </div>
</div>

<footer>

</footer>
<style>
    :root {
      --bg-dark: #09090b;
      --bg-card: #121212;
      --bg-hover: #27272a;
      --green: #1db954;
      --text-main: #ffffff;
      --text-bg: #a1a1aa;
      --border-color: #282828;
      --text-muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Circular Sp", "Segoe UI", Roboto, sans-serif;

      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px;
    }

    header {
      padding: 40px 0;
      text-align: center;
    }
     ul {
      list-style: none;
    }

    li {
      padding: 10px 0;
      border-bottom: 1px solid #282828;
      display: flex;
      align-items: center;
    }
    .miniheader {
      color: #fff;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }
     .midtop-tracks {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border-color);
      transition: background-color 0.3s;
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      color: var(--text-bg);
      text-align: center;
      font-size: 0.8rem;
    }


</style>
</body>
</html>
