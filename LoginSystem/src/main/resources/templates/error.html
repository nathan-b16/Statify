<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error Page</title>
</head>
<title>Oops!</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1ED760;
    }
    .error-container {
      text-align: center;
      padding: 3rem 2rem;
    }
    .error-icon {
      font-size: 4rem;
      color: #dc3545;
      margin-bottom: 1rem;
    }
    h1 {
      font-weight: 700;
      color: #212529;
    }
    h3 {
      font-weight: 400;
      color: #6c757d;
    }
</style>
</html>
<body>
<div class="container">
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="display-3">Oops!</h1>
        <h3 class="mb-4">Something went wrong</h3>
        <a href="/" class="btn btn-primary btn-lg">Go back to login screen</a>
    </div>
</div>
</body>
