<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recommendations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- ── Nav ── -->
<nav class="site-nav">
    <a th:href="@{/TopTracks}" class="active">Top Tracks</a>
    <a th:href="@{/Recommendation}">Recommendation</a>
    <a th:href="@{/MusicAnalysis}">Music Analysis</a>
</nav>

<h1>Your Most Played Tracks</h1>

<div>
    <div>
        <section id="top-tracks" class="midtop-tracks">
            <h2 class="miniheader">Top Tracks</h2>
            <ul>
                <li th:each="track : ${tracks}" th:if="${track != null}">
                    <img th:if="${track.album != null and track.album.images != null and track.album.images.length > 0}"
                         th:src="${track.album.images[0].url}" alt="Track Image" style="width: 50px; height: 50px; border-radius: 4px; margin-right: 15px;">
                    <span th:text="${track.name}" style="color: var(--text-main); font-weight: bold;"></span>
                </li>
            </ul>
        </section>
    </div>
</div>

<a th:href="@{/mydashboard}" class="back-link">
    <i class="bi bi-arrow-left"></i> Back to Dashboard
</a>

<footer>© Created by Nathan | 2026</footer>

<style>
    :root {
      --bg-dark: #09090b;
      --bg-card: #121212;
      --bg-hover: #27272a;
      --green: #1db954;
      --text-main: #ffffff;
      --text-bg: #a1a1aa;
      --border-color: #282828;
      --text-muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Circular Sp", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px;
    }

    header {
      padding: 40px 0;
      text-align: center;
    }

    ul {
      list-style: none;
    }

    li {
      padding: 10px 0;
      border-bottom: 1px solid #282828;
      display: flex;
      align-items: center;
    }

    .miniheader {
      color: #fff;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .midtop-tracks {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border-color);
      transition: background-color 0.3s;
    }

    .site-nav {
        position: sticky;
        top: 0;
        background-color: rgba(9, 9, 11, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-color);
        padding: 20px;
        margin-bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 40px;
        z-index: 100;
    }
    .site-nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 1px;
        transition: color 0.2s;
    }
    .site-nav a:hover, .site-nav a.active { color: var(--green); }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 32px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--green); }

    footer {
      margin-top: 60px;
      padding: 20px;
      color: var(--text-bg);
      text-align: center;
      font-size: 0.8rem;
    }
</style>
</body>
</html>
