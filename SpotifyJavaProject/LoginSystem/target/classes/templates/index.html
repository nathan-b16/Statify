<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify OAuth Integration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            text-align: center;
        }
        .btn-spotify {
            background-color: #1DB954;
            color: #ffffff;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: inline-block;
            margin-top: 20px;
        }
        .btn-spotify:hover {
            background-color: #1ed760;
            transform: scale(1.04);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #b3b3b3; font-size: 1.1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to Spotify stats</h1>
    <p>Connect your account to continue</p>
    <a href="http://127.0.0.1:8080/login" class="btn-spotify">Login with Spotify</a>
</div>
</body>
</html>
