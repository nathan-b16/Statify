<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/Style.css">
   <title>mydashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div>
<nav class = "middlecontent">
  <a href="http://127.0.0.1:8080/TopTracks">Top Tracks</a>
  <a href="http://127.0.0.1:8080/Recommendation">Recommendation</a>
  <a href="http://127.0.0.1:8080/MusicAnalysis">Music Analysis</a>
</nav>
  </div>
  <header style="text-align: center;">
      <h1 class="topheader">
          <i class="bi bi-spotify"></i> Spotify Dashboard
      </h1>
  </header>

  <main>
  <div class="midtop">
      <section id="top-artists" class="midtop-artists">
          <h2 class="miniheader">Top Artists</h2>
              <ul>
                  <li th:each="artist : ${artists}" th:if="${artist != null}">
                      <img th:if="${artist.images != null and artist.images.length > 0}"
                           th:src="${artist.images[0].url}" alt="Artist Image" style="width: 50px; height: 50px; border-radius: 50%; margin-right: 15px;">
                      <span th:text="${artist.name}" style="color: var(--text-main); font-weight: bold;"></span>
                  </li>
              </ul>
      </section>

    <section id="top-tracks" class="midtop-tracks">
      <h2 class="miniheader">Top Tracks</h2>
        <ul>
            <li th:each="track : ${tracks}" th:if="${track != null}">
                <img th:if="${track.album != null and track.album.images != null and track.album.images.length > 0}"
                     th:src="${track.album.images[0].url}" alt="Track Image" style="width: 50px; height: 50px; border-radius: 4px; margin-right: 15px;">
                <span th:text="${track.name}" style="color: var(--text-main); font-weight: bold;"></span>
            </li>
        </ul>
    </section>
  </div>


  <div id="recent-activity" class="infoAboutMe">
      <div class="info-header">
        <h2>Recent Activity</h2>
        <p>Here's what you've been listening to lately.</p>
      </div>

      <div class="stats-container">

        <div class="RecentActivity">
          <p class="stat-label">Recent Played Artist</p>
          <p class="stat-value"
              th:text="${recentTracks != null and !#lists.isEmpty(recentTracks)}
              ? ${recentTracks[0].track.artists[0].name}
              : 'N/A'">
          </p>

        </div>

      <div class="RecentActivity">
          <p class="stat-label">Recent Played Track</p>
          <p class="stat-value"
             th:text="${recentTracks != null and !#lists.isEmpty(recentTracks)}
                ? ${recentTracks[0].track.name}
                : 'N/A'">
          </p>
      </div>

      </div>
    </div>
  </main>

<footer>
  <p>© Created by Nathan | 2026</p>
</footer>
<style>
    :root {
      --bg-dark: #09090b;
      --bg-card: #121212;
      --bg-hover: #27272a;
      --green: #1db954;
      --text-main: #ffffff;
      --text-bg: #a1a1aa;
      --border-color: #282828;
      --text-muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Circular Sp", "Segoe UI", Roboto, sans-serif;

      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px;
    }

    header {
      padding: 40px 0;
      text-align: center;
    }

    .topheader {
      color: var(--green);
      font-size: 2.5rem;
      letter-spacing: -1px;
    }

    .middlecontent {
      position: sticky;
      top: 0;
      background-color: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 100;
    }

    .middlecontent a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .middlecontent a:hover {
      color: var(--green);
    }


    .midtop {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .midtop-tracks, .midtop-artists, .midtop-albums {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border-color);
      transition: background-color 0.3s;
    }

    .midtop-tracks:hover, .midtop-artists:hover, .midtop-albums:hover {
      background-color: var(--bg-hover);
    }

    .miniheader {
      color: #fff;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }


    ul {
      list-style: none;
    }

    li {
      padding: 10px 0;
      border-bottom: 1px solid #282828;
      display: flex;
      align-items: center;
    }

    li:last-child {
      border-bottom: none;
    }

    .list-number {
      color: var(--text-bg);
      margin-right: 15px;
      font-weight: bold;
      width: 20px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .stat-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-bg);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      color: var(--green);
      font-weight: bold;
      font-size: 1.1rem;
    }

    .infoAboutMe {
      margin-top: 40px;
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 30px;
      border: 1px solid var(--border-color);
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      color: var(--text-bg);
      text-align: center;
      font-size: 0.8rem;
    }


</style>
</body>
</html>
